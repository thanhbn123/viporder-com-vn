# =============================================================================
# VIPORDER.COM.VN — containerised stack (staging / small production)
# =============================================================================
# This is an ALTERNATIVE to the systemd deployment in deploy/systemd/. Use one
# or the other, not both.
#
#   cd deploy
#   cp env.production.example .env      # fill it in; .env is git-ignored
#   docker compose up -d
#   docker compose run --rm app alembic upgrade head
#
# The stack deliberately puts PostgreSQL behind the app so the production data
# path is exercised in staging rather than only in development.
# =============================================================================

name: viporder

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viporder}
      POSTGRES_USER: ${POSTGRES_USER:-viporder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viporder} -d ${POSTGRES_DB:-viporder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the app network reaches the database.
    expose:
      - "5432"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-viporder}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-viporder}
      TRUST_PROXY_HEADERS: "yes"
      CORS_ALLOW_ORIGINS: ""
      RATE_LIMIT_ENABLED: "yes"
      MAX_REQUEST_BYTES: "65536"
      # Safe default. A real outbound call additionally needs
      # KHAIBAO9610_ENABLE_REAL_CALLS=yes — see docs/KHAIBAO9610-INTEGRATION.md
      KHAIBAO9610_MODE: ${KHAIBAO9610_MODE:-mock}
      KHAIBAO9610_ENABLE_REAL_CALLS: ${KHAIBAO9610_ENABLE_REAL_CALLS:-no}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"

  # Static site + TLS + rate limiting in front of the app.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../:/srv/viporder/site:ro
      - ./nginx/viporder.com.vn.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params_viporder:/etc/nginx/proxy_params_viporder:ro
      - ./certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot

volumes:
  db-data:
  certbot-webroot:
