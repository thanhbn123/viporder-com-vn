# =============================================================================
# CẤU HÌNH TRIỂN KHAI — VIPORDER.COM.VN  (KHÔNG chứa secret, có trong Git)
# =============================================================================
PROJECT=viporder

# Brief đề nghị /opt/vip/<project>. Dùng được ở đây nếu user triển khai có sudo
# hoặc /opt/vip thuộc về nó. Chưa có host nào nên CHƯA ĐO được điều đó — máy
# chủ nào không cho ghi /opt thì đặt lại APP_ROOT trong deploy.local.conf.
APP_ROOT=/opt/vip/viporder

KEEP_RELEASES=5

HEALTH_PATH=/api/v1/health
READY_PATH=/api/v1/health

# staging: chỉ db + app (xem đầu phần 2 của common.sh để biết vì sao)
STAGING_RUNTIME=compose
PRODUCTION_RUNTIME=compose

# Cổng app mở ở 127.0.0.1 trên máy staging.
STAGING_PORT=18080
# Production đi qua nginx của compose (80/443), nên phép đo trong máy dùng 80.
PRODUCTION_PROXY_PORT=80

# Tên service trong docker-compose.yml — ĐỪNG đổi ở đây mà không đổi file đó.
COMPOSE_APP_SERVICE=app
COMPOSE_DB_SERVICE=db
COMPOSE_NGINX_SERVICE=nginx

# Biến CSDL phải KHỚP docker-compose.yml (mặc định viporder/viporder).
PG_DB=viporder
PG_USER=viporder

# --- Kiểm tra tại máy ----------------------------------------------------
# Lấy đúng các lệnh CI đang chạy, trừ Playwright E2E (xem docs/DIRECT-DEPLOY.md §8).
# ĐÃ ĐO 07/10/2026 trên Mac mini: xem §2 của tài liệu đó để biết bộ nào chạy
# được tại máy và bộ nào cần PostgreSQL.
#
# ⚠️  `ruff` PHẢI chạy trong backend/, không phải ở gốc repo.
#     CI đặt `working-directory: backend` (ci.yml, job `backend-lint`) và cấu
#     hình ruff nằm ở backend/pyproject.toml. Chạy `ruff check .` ở gốc thì nó
#     lint cả tools/ mà KHÔNG có cấu hình đó: đo được 24 "lỗi" mà CI chưa bao
#     giờ thấy, và 12 file "cần format lại" — toàn bộ là dương tính giả.
#     Đây đúng dạng §12.1 luật 3 của CLAUDE.md: một phép đo có phạm vi, mà
#     phạm vi thật khác phạm vi mình tưởng.
LOCAL_TEST_CMDS=(
  'cd backend && $PY -m ruff check .'
  'cd backend && $PY -m ruff format --check .'
  '$PY tools/check_repo_hygiene.py'
  '$PY tools/check_site.py'
  '$PY tools/check_deploy_exposure.py'
  '$PY tools/check_compose.py'
  '$PY tools/check_nginx_config.py'
  '$PY -m pytest -q'
  'node --test tools/js/*.test.js'
)

# --- Host: CỐ Ý ĐỂ TRỐNG -------------------------------------------------
# STAGING_HOST trống KHÔNG phải là thiếu sót: tới 07/10/2026 dự án này CHƯA CÓ
# host staging nào. STAGING_HOST_REQUIREMENTS.md ghi "NOTHING OBTAINED,
# NOTHING DEPLOYED". Điền giá trị phỏng đoán vào đây là biến một việc chưa làm
# thành một việc trông như đã làm.
STAGING_HOST=
STAGING_USER=
STAGING_SSH_KEY=
STAGING_URL=

PRODUCTION_HOST=
PRODUCTION_USER=
PRODUCTION_SSH_KEY=
PRODUCTION_URL=
