# Upstream for the SYSTEMD deployment, where Nginx and the application run on
# the same host and the application binds to loopback only.
#
# Install to /etc/nginx/upstreams/viporder-upstream.conf
# The compose deployment uses upstream-compose.conf instead — see
# deploy/nginx/README.md. The site config includes this path, so exactly one of
# the two must be installed or `nginx -t` fails loudly rather than silently
# proxying to the wrong place.

upstream viporder_app {
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 16;
}
