# Upstream for the COMPOSE deployment, where Nginx and the application are
# separate containers on the same compose network.
#
# Install/mount to /etc/nginx/upstreams/viporder-upstream.conf
#
# WHY THIS FILE EXISTS: the systemd upstream points at 127.0.0.1:8000. Inside
# the nginx container that address is the nginx container ITSELF, so the compose
# stack could never have worked with the systemd upstream — it would have
# proxied to nothing. The service name `app` resolves on the compose network.

upstream viporder_app {
    server app:8000 fail_timeout=10s max_fails=3;
    keepalive 16;
}
