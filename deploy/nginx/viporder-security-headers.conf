# =============================================================================
# VIPORDER.COM.VN — shared security headers
# =============================================================================
# WHY THIS IS A SEPARATE FILE, AND WHY IT IS INCLUDED MORE THAN ONCE
# ---------------------------------------------------------------------------
# Nginx `add_header` does NOT merge across configuration levels. The rule is:
#
#   "These directives are inherited from the previous configuration level if
#    and only if there are no add_header directives defined on the current
#    level."
#
# So a single `add_header Cache-Control ...` inside a `location` silently
# cancels EVERY server-level `add_header` for that location. The homepage is
# served by `location = /`, which needs its own Cache-Control — which means
# that, without this include, the HTML document would have shipped with **no
# CSP, no HSTS, no X-Frame-Options, no X-Content-Type-Options, no
# Referrer-Policy and no Permissions-Policy at all**, while `curl -I` on any
# path that did inherit would have looked perfectly fine.
#
# That failure mode is invisible in review and invisible in a spot check, so
# the headers live in one file and every location that declares its own
# `add_header` must also `include` this file.
#
# RULE FOR FUTURE EDITS: if you add an `add_header` inside a `location` block,
# you MUST add `include .../viporder-security-headers.conf;` to that same
# block. See the check in deploy/nginx/README.md.
# =============================================================================

# HSTS, STAGED. `includeSubDomains` is NOT sent yet, deliberately.
#
# Measured 2026-10-02: `viporder.com.vn`, `www.viporder.com.vn` AND
# `khachhang.viporder.com.vn` all resolve to 103.159.50.70, and the apex
# certificate's SANs do not cover `khachhang`. The cutover therefore replaces the
# server software on the host that also serves the live customer portal.
#
# `includeSubDomains` would bind EVERY subdomain to HTTPS for a year. If the
# portal's certificate does not line up at cutover, returning customers get a TLS
# error they CANNOT click through — and the header that causes it is cached in
# their browser, so rolling the server back does not release them.
#
# `includeSubDomains` is worth having. It is not worth having BEFORE the evidence
# that every subdomain is on valid HTTPS and intends to stay there. Add it in a
# separate, deliberate change once that is measured, and after a TTL of
# `max-age` has been served without incident.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;

# CSP is deliberately permissive only where the dormant analytics layer needs
# it (see docs/SECURITY.md). Tighten once GTM/GA4/Meta Pixel are actually
# enabled — the domains below are the ones the loaders will use.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://connect.facebook.net; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
