# =============================================================================
# VIPORDER.COM.VN — Nginx site configuration
# =============================================================================
# Target architecture:
#
#   Internet
#     -> Nginx (TLS termination, security headers, rate limiting)
#         -> /            static site from /srv/viporder/site
#         -> /api/        reverse proxy -> 127.0.0.1:8000 (uvicorn)
#                           -> SQLite/PostgreSQL lead store
#                           -> KHAIBAO9610 adapter (outbound)
#
# Existing customers are NOT served here. Their portal lives on a different
# host (khachhang.viporder.com.vn) and this configuration never proxies it.
#
# Install:
#   cp deploy/nginx/viporder.com.vn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/viporder.com.vn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# =============================================================================

# --- Rate limiting zones ----------------------------------------------------
# Belt and braces next to the application's own limiter: the app limiter is the
# authority, this one protects Nginx and the upstream socket itself.
limit_req_zone $binary_remote_addr zone=viporder_reg:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=viporder_api:10m rate=120r/m;

# --- Upstream --------------------------------------------------------------
upstream viporder_app {
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 16;
}

# =============================================================================
# HTTP -> HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name viporder.com.vn www.viporder.com.vn;

    # ACME challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://viporder.com.vn$request_uri;
    }
}

# =============================================================================
# www -> apex
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.viporder.com.vn;

    ssl_certificate     /etc/letsencrypt/live/viporder.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viporder.com.vn/privkey.pem;

    return 301 https://viporder.com.vn$request_uri;
}

# =============================================================================
# Main site
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name viporder.com.vn;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/viporder.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viporder.com.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers --------------------------------------------------
    # The application sets its own headers too; these cover static assets that
    # never reach the application.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP is intentionally permissive only where the analytics layer needs it
    # (see docs/SECURITY.md). Tighten once GTM/GA4/Pixel are enabled.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://connect.facebook.net; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- Limits ------------------------------------------------------------
    client_max_body_size 64k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # --- Logging -----------------------------------------------------------
    access_log /var/log/nginx/viporder.access.log;
    error_log  /var/log/nginx/viporder.error.log warn;

    root  /srv/viporder/site;
    index index.html;

    # --- Registration endpoint: strict limit -------------------------------
    location = /api/v1/registrations {
        limit_req zone=viporder_reg burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://viporder_app;
        include /etc/nginx/proxy_params_viporder;
    }

    # --- Everything else under /api ----------------------------------------
    # Matches /api and /api/... but NOT /apifoo
    location ^~ /api/ {
        limit_req zone=viporder_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://viporder_app;
        include /etc/nginx/proxy_params_viporder;
    }

    # --- Static site -------------------------------------------------------
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/static/.*\.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(robots\.txt|sitemap\.xml|favicon\.ico)$ {
        expires 1d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # --- Hide dotfiles ------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
