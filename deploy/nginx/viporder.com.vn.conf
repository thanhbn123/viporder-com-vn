# =============================================================================
# VIPORDER.COM.VN — Nginx site configuration
# =============================================================================
# Target architecture:
#
#   Internet
#     -> Nginx (TLS termination, security headers, rate limiting)
#         -> /            static site from /srv/viporder/site
#         -> /api/        reverse proxy -> 127.0.0.1:8000 (uvicorn)
#                           -> SQLite/PostgreSQL lead store
#                           -> KHAIBAO9610 adapter (outbound)
#
# Existing customers are NOT served here. Their portal lives on a different
# host (khachhang.viporder.com.vn) and this configuration never proxies it.
#
# Install:
#   cp deploy/nginx/viporder.com.vn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/viporder.com.vn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# =============================================================================

# --- Rate limiting zones ----------------------------------------------------
# Belt and braces next to the application's own limiter: the app limiter is the
# authority, this one protects Nginx and the upstream socket itself.
limit_req_zone $binary_remote_addr zone=viporder_reg:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=viporder_api:10m rate=120r/m;

# --- Upstream --------------------------------------------------------------
# Deliberately an include, not an inline block. The correct address differs by
# deployment: 127.0.0.1:8000 under systemd, app:8000 under compose — and under
# compose the loopback address is the nginx container itself, so a hard-coded
# 127.0.0.1 would proxy to nothing. Install exactly one of:
#   /etc/nginx/upstreams/viporder-upstream.conf
# from deploy/nginx/upstream-systemd.conf  or  upstream-compose.conf
include /etc/nginx/upstreams/viporder-upstream.conf;

# =============================================================================
# HTTP -> HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name viporder.com.vn www.viporder.com.vn;

    # ACME challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://viporder.com.vn$request_uri;
    }
}

# =============================================================================
# www -> apex
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.viporder.com.vn;

    ssl_certificate     /etc/letsencrypt/live/viporder.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viporder.com.vn/privkey.pem;

    return 301 https://viporder.com.vn$request_uri;
}

# =============================================================================
# Main site
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name viporder.com.vn;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/viporder.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viporder.com.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers --------------------------------------------------
    # Shared snippet, because nginx `add_header` does NOT merge across levels:
    # a location that declares its own add_header cancels ALL of these for that
    # location. Every such location below includes this same file. See the
    # header comment in security-headers.conf for the full reasoning.
    include /etc/nginx/snippets/viporder-security-headers.conf;

    # --- Limits ------------------------------------------------------------
    client_max_body_size 64k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # --- Logging -----------------------------------------------------------
    access_log /var/log/nginx/viporder.access.log;
    error_log  /var/log/nginx/viporder.error.log warn;

    root  /srv/viporder/site;
    index index.html;

    # --- Registration endpoint: strict limit -------------------------------
    location = /api/v1/registrations {
        limit_req zone=viporder_reg burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://viporder_app;
        include /etc/nginx/proxy_params_viporder;
    }

    # --- Everything else under /api ----------------------------------------
    # Matches /api and /api/... but NOT /apifoo
    location ^~ /api/ {
        limit_req zone=viporder_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://viporder_app;
        include /etc/nginx/proxy_params_viporder;
    }

    # --- Static site -------------------------------------------------------
    # Branded 404. Without this, every mistyped URL got nginx's bare default
    # page — no way back to the site, and nothing an existing customer would
    # recognise. The page is marked noindex, so nginx serves its CONTENT with a
    # 404 status, which is what a crawler must see.
    error_page 404 /404.html;

    # NOTE: every location below that declares its own `add_header` MUST also
    # include the security-headers snippet, or nginx will drop the server-level
    # headers for that location. Do not remove these includes.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/viporder-security-headers.conf;
    }

    location = /404.html {
        # `internal` so the page is only reachable through error_page, never as
        # a directly requestable 200. A 404 document that returns 200 is a
        # soft-404, which is exactly what the noindex is there to avoid.
        internal;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/viporder-security-headers.conf;
    }

    location ~* ^/static/.*\.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        # `expires` would emit its own Cache-Control, giving two of them; the
        # explicit header below is the single source of truth.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/snippets/viporder-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(robots\.txt|sitemap\.xml|favicon\.ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/viporder-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # --- Hide dotfiles ------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
