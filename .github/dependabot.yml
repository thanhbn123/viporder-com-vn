version: 2
updates:
  # Python backend dependencies
  - package-ecosystem: pip
    directory: /backend
    # Work lands on develop and reaches main by the release PR; a bump opened
    # against main would skip develop's CI and conflict with the next release.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - type:chore
      - security
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # CI actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - type:chore
    commit-message:
      prefix: "chore(ci)"
