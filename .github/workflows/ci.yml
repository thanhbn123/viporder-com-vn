name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI must verify the ACTUAL pull-request HEAD, not GitHub's synthetic merge
  # commit. We check out the head SHA explicitly and print it so the verified
  # revision is never ambiguous in the logs.
  # ---------------------------------------------------------------------------
  head:
    name: Resolve verified revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          SHA="${PR_HEAD:-$PUSH_SHA}"
          echo "Verified revision: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  repo-hygiene:
    name: Repo hygiene (secrets, data, size)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert checked-out revision matches the verified revision
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          echo "checked out: $ACTUAL"
          test "$ACTUAL" = "${{ needs.head.outputs.sha }}"
      - name: Repo hygiene checks
        run: python tools/check_repo_hygiene.py

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site-checks:
    name: Site checks (HTML, links, a11y, SEO baseline)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site checks
        run: python tools/check_site.py
      - name: Nginx config guard (add_header inheritance)
        # Nginx drops ALL server-level add_header for any location that declares
        # its own, which once cost this project its entire security-header set
        # on the homepage. Checked as a program, not a comment.
        run: python tools/check_nginx_config.py

  # ---------------------------------------------------------------------------
  # Backend jobs (G02/G03). Each one verifies the PR head SHA, not GitHub's
  # synthetic merge commit. The suite is fully offline: it must never reach a
  # real registration provider, and the live adapter refuses to build at all
  # unless two independent opt-in switches are set.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: head
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Assert checked-out revision matches the verified revision
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          echo "checked out: $ACTUAL"
          test "$ACTUAL" = "${{ needs.head.outputs.sha }}"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # PostgreSQL. The rest of the suite is SQLite by design (fast, no server), but
  # three things production depends on cannot be verified there at all: the
  # partial unique index (declared with postgresql_where), the JSON column, and
  # the migration DDL. Until this job existed, all three were honestly recorded
  # as "never executed on PostgreSQL".
  # ---------------------------------------------------------------------------
  backend-tests-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: head
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: viporder
          POSTGRES_PASSWORD: viporder
          POSTGRES_DB: viporder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://viporder:viporder@127.0.0.1:5432/viporder_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: PostgreSQL smoke tests
        working-directory: backend
        run: python -m pytest tests/test_postgres.py -q
      - name: Concurrency tests
        # These need a real database and real threads. SQLite's locking would
        # make the result an artefact of the harness rather than a measurement
        # of the application, so they live behind the same gate.
        working-directory: backend
        run: python -m pytest tests/test_concurrency.py -q
      - name: Negative control — the guard must refuse a production-looking database
        # These tests DROP the leads table. The guard that refuses a database
        # whose name looks like production is itself a safety control, so it is
        # tested rather than trusted: this step PASSES only if pytest fails.
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://viporder:viporder@127.0.0.1:5432/viporder_prod
        run: |
          if python -m pytest tests/test_postgres.py -q; then
            echo "::error::the destructive-test guard did NOT refuse a production-looking database"
            exit 1
          fi
          echo "guard refused the production-looking database, as intended"

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

  backend-security:
    name: Backend security (bandit)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit==1.9.4
      - name: bandit
        run: bandit -r backend/app

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt
