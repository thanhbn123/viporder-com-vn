name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI must verify the ACTUAL pull-request HEAD, not GitHub's synthetic merge
  # commit. We check out the head SHA explicitly and print it so the verified
  # revision is never ambiguous in the logs.
  # ---------------------------------------------------------------------------
  head:
    name: Resolve verified revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          SHA="${PR_HEAD:-$PUSH_SHA}"
          echo "Verified revision: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  repo-hygiene:
    name: Repo hygiene (secrets, data, size)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Assert checked-out revision matches the verified revision
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          echo "checked out: $ACTUAL"
          test "$ACTUAL" = "${{ needs.head.outputs.sha }}"
      - name: Repo hygiene checks
        run: python tools/check_repo_hygiene.py

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site-checks:
    name: Site checks (HTML, links, a11y, SEO baseline)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Site checks
        run: python tools/check_site.py
      - name: Deploy exposure guard (what the rsync publish list ships)
        # The deploy copied the whole tree and subtracted a few names, so every new
        # root-level file was published BY DEFAULT: measured against real nginx,
        # /package.json, /playwright.config.js, /tests/e2e/*.spec.js and the whole
        # node_modules tree were all fetchable. The deploy now publishes an explicit
        # allow list; this checks it and that it still covers every asset the pages
        # reference.
        run: python tools/check_deploy_exposure.py
      - name: Compose mount guard (nginx includes vs container mounts)
        # Two real defects shipped here and neither was visible until somebody
        # tried to start the stack: the security-headers snippet was included five
        # times but never mounted (nginx exits at startup), and the nginx service
        # mounted the whole repository as the web root (source, docs and tools
        # fetchable over HTTPS). check_nginx_config.py reads the nginx config in
        # isolation and could not see either; this checks the seam with compose.
        run: python tools/check_compose.py
      - name: Nginx config guard (add_header inheritance)
        # Nginx drops ALL server-level add_header for any location that declares
        # its own, which once cost this project its entire security-header set
        # on the homepage. Checked as a program, not a comment.
        run: python tools/check_nginx_config.py

  browser-e2e:
    # ---------------------------------------------------------------------
    # CHUYỂN SANG CHẠY TAY (07/10/2026). Job tốn nhất của workflow này:
    # `npm ci` + `npx playwright install --with-deps chromium` tải cả trình
    # duyệt và thư viện hệ thống cho MỖI lượt chạy.
    #
    # Nó KHÔNG bị xoá, và độ phủ không bị bỏ — nó chuyển chỗ:
    #   · tại máy:   npm run test:e2e  (cùng một bộ spec, cùng playwright.config.js)
    #   · sau deploy: deploy/verify.sh  — đo trên bản ĐANG CHẠY, kể cả chốt
    #     "thứ không publish phải 404", thứ CI không đo được
    #   · từ Internet: deploy/post-deploy-check.sh
    #
    # Chạy lại trên GitHub: tab Actions → CI → Run workflow.
    # Bật lại vĩnh viễn: xoá dòng `if:` ngay dưới.
    #
    # GitHub Actions không còn là cửa quyết định triển khai — xem
    # docs/DIRECT-DEPLOY.md. Nó vẫn là lưới an toàn cho mã vào develop/main.
    #
    # ⚠ ĐỌC TRƯỚC KHI BẬT LẠI, VÀ TRƯỚC KHI SỬA BRANCH PROTECTION
    #
    # Job này KHÔNG còn là required status check của `develop`. Nó đã bị gỡ khỏi
    # danh sách ngày 07/10/2026, và việc gỡ là CỐ Ý.
    #
    # Lý do: dòng `if:` ngay dưới làm job không chạy trên sự kiện `pull_request`,
    # nên nó báo `skipping` — và GitHub tính MỘT REQUIRED CHECK BỊ SKIP LÀ ĐÃ
    # THOẢ. Đo được ngày 07/10: PR #79 có `Browser E2E` ở trạng thái `skipping`
    # mà vẫn `mergeable: MERGEABLE`. Tức là suốt thời gian nó còn nằm trong danh
    # sách required, nó NÊU TÊN MỘT CỬA KHÔNG THỂ ĐỎ: ai đọc cấu hình bảo vệ
    # nhánh sẽ tin tầng trình duyệt đang được gác, trong khi không có gì gác cả.
    # Một chốt canh không thể đỏ thì tệ hơn không có chốt canh, vì nó mua lòng
    # tin mà không trả lại gì.
    #
    # ⚠ ĐÁNH ĐỔI, ghi ra để không ai vấp: gỡ khỏi required nghĩa là NẾU SAU NÀY
    # BẬT LẠI job (xoá dòng `if:`), nó vẫn KHÔNG chặn merge cho tới khi có người
    # thêm lại đúng chuỗi "Browser E2E (desktop + mobile)" vào required status
    # checks của `develop` và `main`. Bật lại job mà quên bước đó = tưởng có gác
    # mà không có. Làm hai việc đó CÙNG LÚC.
    # ---------------------------------------------------------------------
    if: github.event_name == 'workflow_dispatch'
    name: Browser E2E (desktop + mobile)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        # Drives tools/dev_server.py, which serves the repository root and proxies
        # /api to the backend, so the browser sees ONE origin exactly as it will
        # behind nginx. The provider is the MOCK adapter; failure scenarios are
        # chosen by phone suffix rather than by timing, so the run is
        # deterministic. See playwright.config.js.
        #
        # This job exists because the browser layer was the only part of this
        # project no test executed - and the first run of this suite found a
        # customer-visible defect that no backend test could see: every
        # customer-facing message was ENGLISH on a Vietnamese site.
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  js-tests:
    name: JS tests (registration failure handling)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Registration failure handling
        # No dependencies and no browser: `node:test` and `node:assert` are built
        # in, so this adds no supply-chain surface to a project that audits its
        # dependencies and has no lockfile to police.
        #
        # This job exists because the browser layer was the ONLY part of the
        # project verified by reading. The bug it now guards was not a typo - a
        # change in the SERVICE gave an existing HTTP status a new meaning, and
        # the client was reading the status. Nothing about that shape is specific
        # to this one file, so the layer needs to be executable.
        run: node --test "tools/js/*.test.js"

  # ---------------------------------------------------------------------------
  # Backend jobs (G02/G03). Each one verifies the PR head SHA, not GitHub's
  # synthetic merge commit. The suite is fully offline: it must never reach a
  # real registration provider, and the live adapter refuses to build at all
  # unless two independent opt-in switches are set.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: head
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Assert checked-out revision matches the verified revision
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          echo "checked out: $ACTUAL"
          test "$ACTUAL" = "${{ needs.head.outputs.sha }}"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # PostgreSQL. The rest of the suite is SQLite by design (fast, no server), but
  # three things production depends on cannot be verified there at all: the
  # partial unique index (declared with postgresql_where), the JSON column, and
  # the migration DDL. Until this job existed, all three were honestly recorded
  # as "never executed on PostgreSQL".
  # ---------------------------------------------------------------------------
  backend-tests-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: head
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: viporder
          POSTGRES_PASSWORD: viporder
          POSTGRES_DB: viporder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://viporder:viporder@127.0.0.1:5432/viporder_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: PostgreSQL smoke tests
        working-directory: backend
        run: python -m pytest tests/test_postgres.py -q
      - name: Concurrency tests
        # These need a real database and real threads. SQLite's locking would
        # make the result an artefact of the harness rather than a measurement
        # of the application, so they live behind the same gate.
        working-directory: backend
        run: python -m pytest tests/test_concurrency.py -q
      - name: Negative control — the guard must refuse a production-looking database
        # These tests DROP the leads table. The guard that refuses a database
        # whose name looks like production is itself a safety control, so it is
        # tested rather than trusted: this step PASSES only if pytest fails.
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://viporder:viporder@127.0.0.1:5432/viporder_prod
        run: |
          if python -m pytest tests/test_postgres.py -q; then
            echo "::error::the destructive-test guard did NOT refuse a production-looking database"
            exit 1
          fi
          echo "guard refused the production-looking database, as intended"

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .
      # -----------------------------------------------------------------------
      # tools/ is EXECUTED by this workflow (five repo guards + the live-POST
      # tool) but nothing linted it: the backend steps above are pinned to
      # `working-directory: backend`. These steps close that hole.
      #
      # THEY PASS `--config backend/pyproject.toml` ON PURPOSE. There is no
      # `[tool.ruff]` at the repository root, so running ruff from here would
      # fall back to ruff's OWN DEFAULT rule set — a set this project never
      # chose. That default is both broader and narrower than ours at once:
      # broader, because it fires ~19 extra findings (RUF100, EXE001, BLE001)
      # and formats at line-length 88 instead of our 100; narrower, because it
      # let B904 through, a rule our `select = [..., "B", ...]` does catch.
      # One repository, one rule set — tools/ is held to exactly the standard
      # backend/ is.
      #
      # The job name above is kept EXACTLY as the required status check in
      # branch protection; putting the tools/ steps in this job is what makes a
      # tools/ lint error actually block the pull request.
      # -----------------------------------------------------------------------
      - name: ruff check (tools)
        run: ruff check --config backend/pyproject.toml tools
      - name: ruff format --check (tools)
        run: ruff format --check --config backend/pyproject.toml tools

  backend-security:
    name: Backend security (bandit)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit==1.9.4
      - name: bandit
        run: bandit -r backend/app

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt
